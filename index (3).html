<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YashOS — Yash Prakash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#07080a;--fg:#ecebe4;--lime:#c6ff3d;--mut:#8a8d86;--ln:#262a2d;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.65 var(--mono);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,.hdr,footer{position:relative;z-index:1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:20px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,4vw,56px) 12px;background:rgba(7,8,10,.82);border-bottom:1px solid var(--ln);font:500 12px var(--mono);letter-spacing:.08em}
.hdr button{background:none;border:0;cursor:pointer;color:var(--mut);padding:4px 0}
.hdr button:hover{color:var(--lime)}
.brand{color:var(--fg)!important;font-weight:500;margin-right:auto}
.brand b{color:var(--lime)}
.mods{display:flex;gap:20px}
.kbd{border:1px solid var(--ln)!important;padding:4px 10px!important;border-radius:3px}
@media(max-width:760px){.mods{display:none}}
.sec{padding:110px clamp(16px,4vw,56px) 40px;max-width:1280px;margin:0 auto;opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.sec.in{opacity:1;transform:none}
.tag{font:500 12px var(--mono);color:var(--lime);letter-spacing:.14em;margin:0 0 14px}
h2{font-size:clamp(2.2rem,7vw,5.5rem);line-height:.95;margin:0 0 36px;letter-spacing:-.03em;text-transform:uppercase}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:120px;position:relative}
.orb{position:absolute;right:-10vw;top:50%;width:min(86vw,760px);transform:translateY(-50%);opacity:.55;pointer-events:none}
.orb g{transform-origin:300px 300px;animation:spin 90s linear infinite}
.orb .b{animation-duration:140s;animation-direction:reverse}.orb .c{animation-duration:60s}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb g{animation:none}.sec{opacity:1;transform:none;transition:none}*{scroll-behavior:auto!important}}
h1{font-size:clamp(3.4rem,14.5vw,13rem);line-height:.82;letter-spacing:-.05em;margin:0;text-transform:uppercase;position:relative}
h1 span{display:block;color:var(--lime)}
.tl{font:500 clamp(1rem,2.2vw,1.5rem);margin:28px 0 8px;position:relative}
.intro{max-width:56ch;color:var(--mut);margin:0 0 32px;position:relative}
.btns{display:flex;flex-wrap:wrap;gap:12px;position:relative}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border:1px solid var(--fg);background:transparent;cursor:pointer;font:500 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--fg);transition:background .2s,color .2s,border-color .2s,transform .15s}
.btn:hover{background:var(--lime);border-color:var(--lime);color:#07080a}
.btn:active{filter:brightness(.8);scale:.96}
.btn .ar{display:inline-block;transition:transform .25s}.btn:hover .ar{transform:translateX(5px)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:#07080a}.btn.pri:hover{background:var(--fg);border-color:var(--fg)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ln);margin-top:56px;position:relative}
.strip button{background:none;border:0;border-right:1px solid var(--ln);text-align:left;padding:16px 14px;cursor:pointer;font:500 12px var(--mono);letter-spacing:.08em;color:var(--mut)}
.strip button:last-child{border:0}.strip button:hover{color:var(--lime);background:rgba(198,255,61,.05)}
.strip i{display:block;font-style:normal;color:var(--fg);margin-bottom:6px}
@media(max-width:700px){.strip{grid-template-columns:1fr 1fr}}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--ln);padding:26px 0;cursor:pointer}
.row:last-of-type{border-bottom:1px solid var(--ln)}
.row b{font-size:clamp(1.8rem,5vw,3.6rem);letter-spacing:-.03em;line-height:1;transition:color .2s,padding .3s}
.row:hover b{color:var(--lime);padding-left:12px}
.row small,.pill{font:500 11px var(--mono);color:var(--mut);letter-spacing:.1em}
.row p{margin:6px 0 0;color:var(--mut)}
.pill{border:1px solid var(--ln);padding:2px 8px;border-radius:99px;display:inline-block}
.pill.l{color:var(--lime);border-color:var(--lime)}
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.win{width:min(760px,100%);max-height:88svh;display:flex;flex-direction:column;background:#0c0e10;border:1px solid var(--ln);box-shadow:0 0 0 1px rgba(198,255,61,.12),0 30px 80px #000}
.tb{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);font:500 12px var(--mono);color:var(--lime)}
.x{background:none;border:1px solid var(--ln);cursor:pointer;padding:3px 10px;font:500 11px var(--mono);color:var(--mut)}.x:hover{color:var(--lime);border-color:var(--lime)}
.wb{padding:20px;overflow:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tabs button{background:none;border:1px solid var(--ln);padding:7px 12px;cursor:pointer;font:500 12px var(--mono);color:var(--mut)}
.tabs button[aria-selected=true]{background:var(--lime);color:#07080a;border-color:var(--lime)}
.blk h4,.fld{font:500 11px var(--mono);letter-spacing:.1em;color:var(--lime);text-transform:uppercase;margin:16px 0 4px;display:block}
.blk p{margin:0;white-space:pre-wrap}
textarea,input,select{width:100%;background:#07080a;border:1px solid var(--ln);padding:10px;margin-top:6px;border-radius:0;text-transform:none;letter-spacing:0;font-family:'Space Grotesk',sans-serif;font-size:15px}
textarea:focus,input:focus{border-color:var(--lime);outline:0}
.log{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:14px 0;border-top:1px solid var(--ln);align-items:start}
.log small{font:500 11px var(--mono);color:var(--mut)}
.sm{background:none;border:0;color:var(--mut);cursor:pointer;font:500 11px var(--mono);padding:2px 6px}.sm:hover{color:var(--lime)}
@media(max-width:600px){.log{grid-template-columns:1fr}.row{grid-template-columns:40px 1fr}.row .pill{display:none}}
svg.map{width:100%;height:auto;border:1px solid var(--ln);background:rgba(7,8,10,.6)}
.nd{cursor:pointer}.nd circle{fill:#0c0e10;stroke:var(--fg);stroke-width:1.3;transition:fill .2s}.nd.p circle{stroke:var(--lime)}.nd.l circle{stroke-dasharray:4 3;stroke:var(--mut)}
.nd:hover circle,.nd.on circle{fill:var(--lime)}.nd:hover text,.nd.on text{fill:#07080a}.nd text{fill:var(--fg);font:500 11px var(--mono);text-anchor:middle;pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:800px){.g2{grid-template-columns:1fr}}
.err{color:#ff7a6b;font:12px var(--mono);margin:4px 0 0}
.msg{padding:12px;border:1px solid;margin-top:14px;font-size:14px}.msg.ok{border-color:var(--lime)}.msg.er{border-color:#ff7a6b}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--lime);color:#07080a;padding:10px 16px;font:500 13px var(--mono);max-width:92vw}
.pal{width:min(560px,100%);background:#0c0e10;border:1px solid var(--lime)}
.pal ul{list-style:none;margin:0;padding:0;max-height:50svh;overflow:auto}
.pal li{padding:10px 16px;cursor:pointer;font:500 13px var(--mono);color:var(--mut)}
.pal li[aria-selected=true]{background:var(--lime);color:#07080a}
.pal input{margin:0;border:0;border-bottom:1px solid var(--ln);padding:16px}
footer{padding:40px clamp(16px,4vw,56px);font:12px var(--mono);color:var(--mut);border-top:1px solid var(--ln);margin-top:60px}
.ph{margin:0 0 24px;position:relative;width:min(100%,340px);aspect-ratio:4/5;border:1px solid var(--ln)}.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.04) saturate(.9)}.ph::before,.ph::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--lime);pointer-events:none}.ph::before{top:-6px;left:-6px;border-right:0;border-bottom:0}.ph::after{bottom:-6px;right:-6px;border-left:0;border-top:0}.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(7,8,10,.9));font:11px var(--mono);letter-spacing:.1em;color:var(--lime)}
.edu{display:flex;gap:14px;align-items:center;margin:0 0 22px;font:12px var(--mono);color:var(--mut)}.edu img{width:56px;height:56px;border-radius:50%;background:#fff;flex:none}.edu b{color:var(--fg);font-weight:500;display:block}.lg{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:8px;background:#fff}
.cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px;align-items:center}.cf input{margin:0}
.fl{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:30px;align-items:start}@media(max-width:800px){.fl{grid-template-columns:1fr}}
.fn{cursor:pointer}.fn circle{fill:#0c0e10;stroke:var(--lime);stroke-width:1.5;transition:fill .2s,stroke .2s}.fn:hover circle{fill:rgba(198,255,61,.15)}.fn.d circle{stroke:#ff7a6b;stroke-dasharray:3 3;fill:#1a0d0c}.fn text{fill:var(--fg);font:500 12px var(--mono);text-anchor:middle;pointer-events:none}.fn.d text{fill:#ff7a6b}
.chip{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--ln);margin-bottom:6px;font-size:13px}.chip.ok{border-color:rgba(198,255,61,.5)}.chip.lost{border-color:#ff7a6b;color:#ff7a6b}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--lime);height:28px}.gauge{height:12px;border:1px solid var(--ln);margin:10px 0 6px}.gauge div{height:100%;transition:width .25s,background .25s}
.rise{opacity:0;animation:rise .5s forwards}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.win.arch{width:min(980px,100%);animation:door .6s cubic-bezier(.2,.8,.2,1)}@keyframes door{from{clip-path:inset(0 50% 0 50%);opacity:.3}to{clip-path:inset(0);opacity:1}}
.arc{display:flex;align-items:center;gap:22px;width:100%;max-width:640px;text-align:left;padding:22px;border:1px solid var(--ln);background:rgba(8,10,12,.85);cursor:pointer;transition:border-color .2s,box-shadow .3s}.arc:hover{border-color:var(--lime);box-shadow:0 0 40px rgba(198,255,61,.12)}.arc:active{scale:.99}
.arc b{display:block;font:700 clamp(1.2rem,3.5vw,1.8rem)/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em}.arc small{display:block;color:var(--mut);margin:6px 0 10px;font:12px var(--mono)}.arc i{font:500 12px var(--mono);color:var(--lime);font-style:normal;letter-spacing:.12em}.arc span{display:block}.arc svg{flex:none}
.arc .r1,.arc .r2{transform-origin:60px 60px;animation:spin 30s linear infinite}.arc .r2{animation-duration:18s;animation-direction:reverse}.arc .sh{transition:transform .35s}.arc:hover .sh{transform:translateY(-5px)}
@media(prefers-reduced-motion:reduce){.rise{opacity:1;animation:none}.win.arch{animation:none}.arc .r1,.arc .r2{animation:none}}
.me{margin:0;position:absolute;right:clamp(16px,5vw,80px);top:clamp(110px,14vh,150px);width:clamp(220px,25vw,340px);aspect-ratio:4/5;z-index:2;transition:transform .2s ease-out;animation:meIn 1.1s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes meIn{from{clip-path:inset(0 0 100% 0);opacity:0}to{clip-path:inset(-24px);opacity:1}}
.mf{position:absolute;inset:0;overflow:hidden;border:1px solid var(--lime);box-shadow:0 0 60px rgba(198,255,61,.14);animation:flt 7s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}
.mf img{width:100%;height:100%;object-fit:cover;display:block;animation:pg 8s infinite}
@keyframes pg{0%,92%,100%{transform:none;filter:none}94%{transform:translateX(3px);filter:contrast(1.25) hue-rotate(25deg)}96%{transform:translateX(-3px)}}
.mf::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),linear-gradient(transparent 70%,rgba(7,8,10,.55));pointer-events:none}
.scan{position:absolute;left:0;right:0;top:0;height:3px;background:var(--lime);box-shadow:0 0 18px 4px rgba(198,255,61,.55);z-index:2;animation:scn 4.5s ease-in-out infinite}
@keyframes scn{0%,100%{top:0;opacity:0}10%,90%{opacity:.9}50%{top:98%}}
.me::before,.me::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--lime);z-index:3;pointer-events:none}.me::before{top:-8px;left:-8px;border-right:0;border-bottom:0}.me::after{bottom:-8px;right:-8px;border-left:0;border-top:0}
.me .c1,.me .c2{position:absolute;z-index:3;background:rgba(7,8,10,.88);border:1px solid var(--lime);padding:3px 9px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--lime);animation:flt 5s ease-in-out infinite}.me .c1{left:-26px;bottom:14%}.me .c2{right:-18px;top:10%;animation-delay:-2s}
@media(max-width:1000px){.me{position:relative;right:auto;top:auto;width:min(62vw,250px);margin:0 0 28px}.me .c1{left:8px;bottom:10px}.me .c2{right:8px;top:8px}}
@media(prefers-reduced-motion:reduce){.me,.mf,.scan,.mf img,.me .c1,.me .c2{animation:none!important}.scan{display:none}}
a{color:var(--lime)}
h1,h2,.row b{font-family:'Space Grotesk',system-ui,sans-serif}
.tl{font-family:var(--mono);font-size:clamp(1rem,2.2vw,1.35rem);color:var(--lime)}
textarea,input,select{font-family:var(--mono)!important;font-size:13px!important}
h1{animation:gl 7s infinite}
@keyframes gl{0%,93%,100%{text-shadow:none}94%{text-shadow:3px 0 #ff2e63,-3px 0 #19e3ff}96%{text-shadow:-3px 0 #ff2e63,3px 0 #19e3ff}}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
h2{font-size:clamp(2rem,6vw,4.2rem);border-left:3px solid var(--lime);padding-left:16px}
h2::after{content:"_";color:var(--lime);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.win{border-top:2px solid var(--lime)}
.term{margin-top:40px;max-width:720px;border:1px solid var(--ln);background:rgba(8,10,12,.9);position:relative;font:13px/1.55 var(--mono)}
.term::before,.term::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--lime)}
.term::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.term::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.th{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);color:var(--mut);font-size:11px;letter-spacing:.1em}
.th i{width:8px;height:8px;border-radius:50%;background:var(--ln)}.th i:first-child{background:var(--lime)}
.tbd{padding:12px 14px;max-height:230px;overflow:auto;cursor:text}
.tbd p{margin:0;white-space:pre-wrap;color:var(--mut)}.tbd p.c{color:var(--fg)}
.tin{display:flex;gap:8px;align-items:center}.tin input{margin:0;border:0!important;padding:2px 0;background:transparent;flex:1}
.boot{position:fixed;inset:0;z-index:100;background:var(--bg);padding:calc(24px + env(safe-area-inset-top,0px)) clamp(16px,6vw,80px);font:13px/1.8 var(--mono);color:var(--mut);cursor:pointer}
.boot b{color:var(--lime);font-weight:500}
.hud{font:11px var(--mono);color:var(--mut);display:flex;gap:14px}.hud b{color:var(--lime);font-weight:500}
@media(max-width:900px){.hud{display:none}}
@media(prefers-reduced-motion:reduce){h1,h2::after{animation:none}}
